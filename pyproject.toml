[project]
name = "super-jarvis"
version = "0.1.0"
description = "Assistente pessoal para Windows com o Claude como cérebro principal"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pywebview>=6.2",
    "pystray>=0.19",
    "Pillow>=10.1",
    "keyring>=25",
    "psutil>=5.9",
    "mcp>=2.3,<3",
    "google-auth-oauthlib>=1.2",
    "msal>=1.31",
    "faster-whisper>=1.1",
    "openwakeword>=0.6",
    "sounddevice>=0.4",
    "edge-tts>=7",
    "miniaudio>=1.59",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
"jarvis.ui" = ["*.html"]
"jarvis.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
