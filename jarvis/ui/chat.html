<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg: #0f1216; --surface: #171b21; --surface-2: #1f252d; --border: #2a313b;
    --text: #e7ebf0; --muted: #8b96a5; --accent: #4cc2ff; --accent-text: #06202e;
    --user: #1d3a4d; --danger: #ff8a80;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa; --surface: #ffffff; --surface-2: #eef1f5; --border: #d8dee6;
      --text: #14181d; --muted: #5d6875; --accent: #0067c0; --accent-text: #ffffff;
      --user: #dcecfa; --danger: #b3261e;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .orb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }
  .orb.busy { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .orb.busy { animation: none; opacity: .6; } }
  h1 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; }
  button {
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: flex-start; color: var(--danger); background: transparent; border: 1px dashed var(--danger); }
  .meta { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  form { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 1px solid var(--border); background: var(--surface); }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 160px; padding: 10px 12px;
    font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px;
  }
  #send { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; padding: 0 18px; }
  .card {
    align-self: stretch; padding: 12px 14px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--accent);
  }
  .card p { margin: 0 0 4px; }
  .card .why { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .card .buttons { display: flex; gap: 8px; }
  .card .approve { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  .card .outcome { margin-top: 8px; font-size: 13px; }
  .card.done { border-color: var(--border); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <span class="orb" id="orb" aria-hidden="true"></span>
    <h1>Jarvis</h1>
    <button type="button" id="reset" title="Apagar o histórico desta conversa">Nova conversa</button>
  </header>

  <main id="log" role="log" aria-live="polite" aria-label="Conversa com a Jarvis"></main>

  <form id="form">
    <label for="input" class="sr-only">Mensagem para a Jarvis</label>
    <textarea id="input" rows="1" placeholder="Fale com a Jarvis… (Enter envia, Shift+Enter quebra linha)" autofocus></textarea>
    <button type="submit" id="send">Enviar</button>
  </form>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const form = document.getElementById("form");
  const send = document.getElementById("send");
  const orb = document.getElementById("orb");
  let busy = false;

  // Só **negrito**; o texto entra como nós de texto, nunca como HTML.
  function renderText(el, text) {
    text.split(/(\*\*[^*]+\*\*)/g).forEach((part) => {
      if (/^\*\*[^*]+\*\*$/.test(part)) {
        const b = document.createElement("strong");
        b.textContent = part.slice(2, -2);
        el.appendChild(b);
      } else if (part) {
        el.appendChild(document.createTextNode(part));
      }
    });
  }

  function addActionCard(action) {
    const card = document.createElement("section");
    card.className = "card";
    card.setAttribute("aria-label", "Ação aguardando sua aprovação");
    const what = document.createElement("p");
    what.textContent = action.descricao;
    const why = document.createElement("p");
    why.className = "why";
    why.textContent = "Motivo: " + action.motivo;
    const buttons = document.createElement("div");
    buttons.className = "buttons";
    const ok = document.createElement("button");
    ok.type = "button"; ok.className = "approve"; ok.textContent = "Aprovar";
    const no = document.createElement("button");
    no.type = "button"; no.textContent = "Recusar";
    buttons.append(ok, no);
    card.append(what, why, buttons);
    log.appendChild(card);
    log.scrollTop = log.scrollHeight;

    async function decide(approve) {
      ok.disabled = no.disabled = true;
      const res = await window.pywebview.api.decide(action.id, approve);
      buttons.remove();
      card.classList.add("done");
      const out = document.createElement("p");
      out.className = "outcome";
      out.textContent = res.resultado;
      card.appendChild(out);
    }
    ok.addEventListener("click", () => decide(true));
    no.addEventListener("click", () => decide(false));
  }

  function add(kind, text, meta) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    renderText(el, text);
    if (meta) {
      const m = document.createElement("span");
      m.className = "meta";
      m.textContent = meta;
      el.appendChild(m);
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function setBusy(on) {
    busy = on;
    send.disabled = on;
    orb.classList.toggle("busy", on);
  }

  async function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = "";
    autosize();
    add("user", text);
    setBusy(true);
    const thinking = add("jarvis", "Pensando…");
    try {
      const res = await window.pywebview.api.send(text);
      thinking.remove();
      if (res.error) add("error", res.error);
      else {
        add("jarvis", res.text, "via " + res.brain);
        (res.actions || []).forEach(addActionCard);
      }
    } catch (err) {
      thinking.remove();
      add("error", "Falha ao falar com o núcleo da Jarvis: " + err);
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("input", autosize);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  document.getElementById("reset").addEventListener("click", async () => {
    if (busy) return;
    await window.pywebview.api.reset();
    log.textContent = "";
    add("jarvis", "Conversa nova. Em que posso ajudar?");
    input.focus();
  });

  window.addEventListener("pywebviewready", async () => {
    const hello = await window.pywebview.api.greeting();
    add("jarvis", hello);
  });
</script>
</body>
</html>
