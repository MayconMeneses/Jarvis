  <dialog id="perfil" aria-labelledby="perfil-title">
    <h2 id="perfil-title">Meu perfil</h2>
    <p class="pf-intro">O que a Jarvis sabe sobre você para conversar do seu jeito. Para mudar ou apagar algo, ela cria um cartão e só grava depois do seu <b>Aprovar</b>.</p>
    <p class="pf-nunca" role="note"><b>Nunca é guardado:</b> senhas, documentos, valores em dinheiro e dados de saúde.</p>
    <div id="pf-lista" class="pf-lista" aria-busy="false"></div>
    <p class="feedback" id="pf-info" role="status"></p>
    <div class="dialog-actions"><button type="button" id="close-perfil">Fechar</button></div>
  </dialog>
